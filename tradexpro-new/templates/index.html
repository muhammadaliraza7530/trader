<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Loading</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1e2329;
            color: #eaecef;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none overflow-hidden">

    <!-- Top Spacer -->
    <div></div>

    <!-- Center Content: Logo & Loading State -->
    <div class="flex flex-col items-center justify-center space-y-4">
        <!-- App Logo -->
        <img src="/static/logo/logo.png" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='/logo/logo.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='/public/logo/logo.png';}" alt="{{ site_name }} logo" class="w-16 h-16 object-contain animate-spin">
        <!-- Loading Text -->
        <div id="loading-status" class="text-[#F0B90B] font-semibold text-base tracking-wide" aria-live="polite">
            Loading...
        </div>
    </div>

    <!-- Bottom Download Banner -->
    <div class="flex flex-col items-center w-full pb-5 px-5 gap-4">
        <div class="text-xs md:text-[16px] text-white font-normal">version 1.0</div>
        <!-- Download Banner -->
        <div id="download-banner" class="w-full bg-[#1e2329] shadow-md shadow-[black] rounded-xl px-4 py-3.5 grid grid-cols-[1fr_auto_1fr] items-center transition-all duration-300">
            <!-- Close Button -->
            <button id="close-banner" class="justify-self-start text-white hover:text-gray-300 transition-colors cursor-pointer text-lg font-bold">
                &times;
            </button>

            <!-- Centered App Identity -->
            <div class="col-start-2 flex items-center gap-2">
                <img src="/static/logo/logo.png" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='/logo/logo.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='/public/logo/logo.png';}" alt="{{ site_name }} logo" class="w-8 h-8 object-contain">
                <div class="flex flex-col">
                    <span class="text-[#e1ae0d] font-medium text-sm">{{ site_name }} App</span>
                    <span class="text-white text-xs font-normal">Secure & Fast</span>
                </div>
            </div>

            <!-- Download Button -->
            <div class="justify-self-end">
                <a href="#" id="download-btn" class="bg-[#F0B90B] hover:bg-[#fcd535] text-black font-medium text-sm px-4 py-1.5 rounded-full transition-colors inline-block">
                    Download
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript for Interactivity -->
    <script>
        const closeBtn = document.getElementById('close-banner');
        const downloadBanner = document.getElementById('download-banner');

        closeBtn.addEventListener('click', () => {
            downloadBanner.style.opacity = '0';
            setTimeout(() => {
                downloadBanner.style.display = 'none';
            }, 300);
        });

        const loadingStatus = document.getElementById('loading-status');

        async function checkReadiness() {
            if (!navigator.onLine) {
                loadingStatus.textContent = 'Loading...';
                setTimeout(checkReadiness, 2000);
                return;
            }

            loadingStatus.textContent = 'Loading...';
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);

            try {
                const response = await fetch('/api/ready', {
                    cache: 'no-store',
                    signal: controller.signal,
                });
                const readiness = await response.json();

                if (response.ok && readiness.ready) {
                    window.location.replace('/login');
                    return;
                }

                if (readiness.reason === 'database_not_configured') {
                    loadingStatus.textContent = 'Loading...';
                    return;
                }

                loadingStatus.textContent = 'Loading...';
            } catch (error) {
                loadingStatus.textContent = 'Loading...';
            } finally {
                clearTimeout(timeout);
            }

            setTimeout(checkReadiness, 2000);
        }

        window.addEventListener('online', checkReadiness);
        window.addEventListener('offline', () => {
            loadingStatus.textContent = 'Loading...';
        });
        checkReadiness();
    </script>
</body>
</html>
