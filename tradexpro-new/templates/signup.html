<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeXPro - Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="signup-page">
    <main class="login-layout">
        <section class="login-panel" aria-labelledby="signup-title">
            <header class="login-header">
                <img class="login-logo" src="{{ url_for('static', filename='logo/logo.png') }}" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='/logo/logo.png';}else if(this.dataset.retry==1){this.dataset.retry=2;this.src='/public/logo/logo.png';}" alt="TradeXPro logo">
                <h1 id="signup-title">Sign Up</h1>
                <p>Hey there! Ready to join the party? We just need a few details from you to get started. Let's do this!</p>
            </header>

            <form class="login-form" action="{{ url_for('signup') }}" method="post">
                {% if message %}
                    <p class="form-message" role="status">{{ message }}</p>
                {% endif %}
                <div class="form-field">
                    <label for="full-name">Full Name</label>
                    <div class="input-shell">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="9" cy="8" r="4"></circle>
                            <path d="M2 21a7 7 0 0 1 14 0zM19 5v6M16 8h6"></path>
                        </svg>
                        <input id="full-name" name="full_name" type="text" placeholder="enter your fullname" autocomplete="name" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="username">Username</label>
                    <div class="input-shell">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4.5 21a7.5 7.5 0 0 1 15 0z"></path>
                        </svg>
                        <input id="username" name="username" type="text" placeholder="enter your username" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">Email Address</label>
                    <div class="input-shell">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m3 6 9 7 9-7"></path>
                        </svg>
                        <input id="email" name="email" type="email" placeholder="enter your email address" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="input-shell">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="12" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
                            <circle class="lock-keyhole" cx="12" cy="15.5" r="1"></circle>
                        </svg>
                        <input id="password" name="password" type="password" placeholder="enter any password" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="withdraw-pin">Withdraw Pin</label>
                    <div class="input-shell">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="12" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
                            <circle class="lock-keyhole" cx="12" cy="15.5" r="1"></circle>
                        </svg>
                        <input id="withdraw-pin" name="withdraw_pin" type="password" placeholder="enter your withdraw pin" inputmode="numeric" autocomplete="off" required>
                    </div>
                </div>
                  <div class="form-field">
                    <label for="withdraw-pin">Refer Code</label>
                    <div class="input-shell">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="12" rx="2"></rect>
                            <path d="M8 10V7a4 4 0 1 1 8 0v3"></path>
                            <circle class="lock-keyhole" cx="12" cy="15.5" r="1"></circle>
                        </svg>
                        <input id="refer-code" name="refer_code" type="password" placeholder="enter refer code (optional)" inputmode="numeric" autocomplete="off" >
                    </div>
                </div>

                <button class="sign-in-button" type="submit">Sign Up</button>
            </form>

            <p class="signup-prompt">Already a member? <a href="{{ url_for('login') }}">Log In</a></p>
        </section>
    </main>
</body>
</html>
